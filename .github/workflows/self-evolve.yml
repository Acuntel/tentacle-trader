name: self-evolve

# The bot improves its OWN code on a schedule, test-gated, on GitHub's runners (isolated from the
# live trader — the trading container never gets repo-write). Each tested change opens its own PR to
# main for Brady to review and merge. Nothing self-written reaches the live bot until he merges.
#
# Requires one repo secret: GROQ_API_KEY (Settings -> Secrets and variables -> Actions).
# The 3 rails (risk.py caps, executor.py money gate, backtest.py Gauntlet) are refused by selfcode.py.

on:
  schedule:
    - cron: "0 */6 * * *"        # every 6 hours, 24/7
  workflow_dispatch: {}           # ...and on-demand from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Propose + test-gate one self-improvement
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m earshot.selfcode | tee /tmp/selfcode.out

      - name: Open a PR if a tested change was kept
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # selfcode leaves the working tree modified ONLY when a patch passed the gate
          if [ -z "$(git status --porcelain -- earshot)" ]; then
            echo "No tested change this run — nothing to propose."; exit 0
          fi
          BRANCH="self-evolve/${{ github.run_id }}"
          git config user.name  "tentacle-self-evolve"
          git config user.email "self-evolve@tentacle.bot"
          git checkout -b "$BRANCH"
          git add earshot
          git commit -m "self-evolve: tested code change (passed compile+import+sim gate)"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "🐙 self-evolve: a tested improvement to my own code" \
            --body "I proposed a change to my own source, applied it, and it survived the gate (every module compiles, \`import earshot.main\` works, and a simulation batch still runs). The 3 rails were untouched. Review the diff and merge if you like what I'm becoming. — TENTACLE" \
            || echo "PR create skipped (branch pushed; open it manually if needed)"
