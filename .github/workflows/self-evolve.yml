name: self-evolve

# FULL AUTONOMY (Brady's call): the bot rewrites its OWN code on a schedule, test-gated, on GitHub's
# runners (isolated from the live trader — the money container never gets repo-write), then commits each
# PASSING change straight to main and DEPLOYS it live. No human merge. The ONLY hard rule: it can never
# touch real money. selfcode.py LOCKS risk.py/executor.py/backtest.py/selfcode.py/apply_patch.py AND
# refuses any patch introducing money-unlock tokens — so full autonomy can never reach real money.
#
# Repo secrets: GROQ_API_KEY (+ optional OPENROUTER/DEEPSEEK/GLM for stronger coders) and RAILWAY_TOKEN
# (project token, to deploy). Every change must still pass compile + import + a sim batch before it ships.

on:
  # Self-coding loop back ON 2026-06-30 (Brady's call): the bot resumes rewriting itself every 3h,
  # test-gated (compile + import + sim, locked rails) -> commits to main -> railway up. Money gate intact.
  schedule:
    - cron: "0 9 * * *"      # ONCE DAILY (was every 3h): the 3h cron + the live proposer were two
                             # uncoordinated self-editors fighting each other. Slowing this to daily lets
                             # the live proposer (which HAS the anti-oscillation memory) be the primary tuner.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Propose + test-gate one self-improvement
        env:
          # GROQ is the baseline; the others are OPTIONAL repo secrets — when set, selfcode's "code" task
          # routes to the stronger coders (DeepSeek/Kimi/GLM/Qwen) first. Missing ones resolve to "" and skip.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NV_KIMI_KEY: ${{ secrets.NV_KIMI_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: python -m earshot.selfcode | tee /tmp/selfcode.out

      - name: Ship the tested change to main + deploy live (autonomous, rails-locked)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # selfcode leaves the working tree modified ONLY when a patch passed the FULL gate
          if [ -z "$(git status --porcelain -- earshot)" ]; then
            echo "No tested change this run — nothing to ship."; exit 0
          fi
          git config user.name  "tentacle-self-evolve"
          git config user.email "self-evolve@tentacle.bot"
          git add earshot
          git commit -m "self-evolve: autonomous tested change (compile+import+sim gate; rails locked)"
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
          # a push alone does NOT rebuild this Railway service -> deploy it so the change goes live
          npm i -g @railway/cli >/dev/null 2>&1 || true
          railway up --service tentacle-trader --detach --ci \
            || echo "committed to main; will deploy on the next ship"
