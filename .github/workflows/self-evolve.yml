name: self-evolve

# FULL AUTONOMY (Brady's call): the bot rewrites its OWN code on a schedule, test-gated, on GitHub's
# runners (isolated from the live trader — the money container never gets repo-write), then commits each
# PASSING change straight to main and DEPLOYS it live. No human merge. The ONLY hard rule: it can never
# touch real money. selfcode.py LOCKS risk.py/executor.py/backtest.py/selfcode.py/apply_patch.py AND
# refuses any patch introducing money-unlock tokens — so full autonomy can never reach real money.
#
# Repo secrets: GROQ_API_KEY (+ optional OPENROUTER/DEEPSEEK/GLM for stronger coders) and RAILWAY_TOKEN
# (project token, to deploy). Every change must still pass compile + import + a sim batch before it ships.

on:
  # Self-coding loop back ON 2026-06-30 (Brady's call): the bot resumes rewriting itself every 3h,
  # test-gated (compile + import + sim, locked rails) -> commits to main -> railway up. Money gate intact.
  schedule:
    - cron: "0 9 * * *"      # ONCE DAILY (was every 3h): the 3h cron + the live proposer were two
                             # uncoordinated self-editors fighting each other. Slowing this to daily lets
                             # the live proposer (which HAS the anti-oscillation memory) be the primary tuner.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      # The daily state backup (Acuntel/tentacle-state) gives CI the REAL learned brain + ledger, so the
      # FITNESS gate (patch must not worsen prediction Brier on real outcomes) is live here too — without
      # it selfcode only proves "doesn't crash". Missing token/files degrade gracefully (fitness skips).
      - name: Pull the learned brain (fitness baseline) from the state backup
        env:
          GH_TOKEN: ${{ secrets.STATE_PULL_TOKEN }}
        run: |
          mkdir -p state
          for f in knowledge.json resolved_obs.jsonl; do
            curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/Acuntel/tentacle-state/contents/latest/$f" -o "state/$f" \
              && echo "pulled $f" || echo "no $f (fitness gate will skip)"
          done

      - name: Propose + test-gate one self-improvement
        env:
          # Only secrets that actually EXIST on the repo are passed (AUDIT: GROQ/GEMINI/DEEPSEEK/GLM
          # were referenced but never set — the "baseline" coder never participated; the pool below is
          # what really powers CI self-coding).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NV_KIMI_KEY: ${{ secrets.NV_KIMI_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
        run: python -m earshot.selfcode | tee /tmp/selfcode.out

      - name: Ship the tested change to main + deploy live (autonomous, rails-locked)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # selfcode leaves earshot/ modified ONLY when a patch passed the FULL gate. state_seed/
          # holds (a) the repo-riding CI ledger — W3.4: every CI-applied patch's record ships IN THE
          # SAME COMMIT as the patch, so the live coach can count + score CI changes like live ones —
          # and (b) quarantined patches (W3.5: target has no routed deterministic metric — parked
          # for the Telegram approval path instead of auto-shipping on crash-checks alone).
          CODE_CHANGED="$(git status --porcelain -- earshot)"
          SEED_CHANGED="$(git status --porcelain -- state_seed)"
          if [ -z "$CODE_CHANGED" ] && [ -z "$SEED_CHANGED" ]; then
            echo "No tested change this run — nothing to ship."; exit 0
          fi
          git config user.name  "tentacle-self-evolve"
          git config user.email "self-evolve@tentacle.bot"
          git add earshot state_seed
          git commit -m "self-evolve: autonomous tested change (compile+import+sim gate; rails locked)"
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
          if [ -z "$CODE_CHANGED" ]; then
            echo "Ledger/quarantine record only — no code change, skipping the deploy."; exit 0
          fi
          # DEPLOY-INTEGRITY: ship exactly what is ON MAIN after the push — never this runner's tree.
          # (A push race once deployed a patched sim.py that wasn't on main; it crashed every cycle.)
          git fetch origin main && git reset --hard origin/main
          # a push alone does NOT rebuild this Railway service -> deploy it so the change goes live
          npm i -g @railway/cli >/dev/null 2>&1 || true
          railway up --service tentacle-trader --detach --ci \
            || echo "committed to main; will deploy on the next ship"
