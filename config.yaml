# TENTACLE — all thresholds in one place. Tune here, not in code.

identity:
  name: TENTACLE
  mode: shadow          # shadow | live   (live is REFUSED until the Gauntlet passes + you arm it)

# ---- The survival ethos (mother & son) ----
survival:
  starting_capital: 500.0
  loss_aversion_lambda: 2.5     # a loss hurts 2.5x more than an equal gain feels good
  ruin_floor_pct: 0.40          # lose 40% of a stage's capital -> the son "dies" (halts + demotes)
  growth_target: 10.0           # the mother trains her SON to grow this many x the stake (ambition, not a cap)
  goal_monthly_return_pct: 20   # Brady's target the engine HUNTS for. ~9x/yr — aspirational; the real-money
                                # gate only unlocks on a PROVEN out-of-sample edge, which may never reach this.
  # The graduation ladder: capital is EARNED rung by rung. Full $500 is the top, not the default.
  # NOTE: mastery 85+ is mathematically unreachable at a ~0.50 win rate (the old bars guaranteed a
  # permanent stall). These bars are realistic-but-demanding for a genuine edge AND require large
  # sample counts for statistical significance. Real money is STILL independently gated by the
  # Gauntlet (executor GAUNTLET_PASS_MASTERY) + identity.mode=live + manual arm — these rungs only
  # govern the shadow learning stages, so making them climbable risks nothing.
  ladder:
    - {rung: -1, stage: backtest_gauntlet, capital: 0,   promote_mastery: 58, min_samples: 200}
    - {rung: 0,  stage: live_shadow,       capital: 0,   promote_mastery: 60, min_samples: 80}
    - {rung: 1,  stage: micro,             capital: 25,  promote_mastery: 62, min_samples: 40}
    - {rung: 2,  stage: small,             capital: 75,  promote_mastery: 65, min_samples: 40}
    - {rung: 3,  stage: half,              capital: 250, promote_mastery: 68, min_samples: 50}
    - {rung: 4,  stage: full,              capital: 500, promote_mastery: 72, min_samples: 60}

# ---- The firing gate ----
conviction:
  min_score_to_trade: 15        # LOWERED again 2026-06-30 (25->15): trade more of the qualifying multi-confirm
                                # setups. Shadow only; real money still hard-gated. NOTE: trade COUNT is mostly
                                # capped by the 2-source/2-family multi-confirm requirement below (the strategy's
                                # core) + max_open_positions, not by this score — lowering further does little.
  min_independent_sources: 2    # >= 2 independent sources must confirm the SAME catalyst
  min_families: 2               # >= 2 DIFFERENT signal families (filing+surprise+flow...), not 2 of the same
  min_pwin: 0.40                # once the learned model has >=30 samples, require P(win) above this to fire
  shadow_explore: true          # in shadow, take every setup that clears HARD safety (bypass soft/heuristic
                                # vetoes) so the learner gets real out-of-sample data. Set false to mirror live.
  regime_downtrend_premium: 15  # in LIVE, a downtrend tape doesn't bench longs — it raises the score bar by this
  family_bonus: 0.18            # confidence multiplier per extra family that agrees (cross-confirmation)
  max_runup_pct: 4.0            # if price already ran > this since the signal, the easy move is gone
  size_bands:                   # confidence score -> fraction of the rung's live capital
    - {min: 95, frac: 1.00}
    - {min: 85, frac: 0.70}
    - {min: 70, frac: 0.45}
    - {min: 55, frac: 0.20}

# ---- WS1 Shadow exploration: FLOOD the learners with forward samples (off-book) ----
# In SHADOW only, every QUALIFYING name (not just the one conviction pick) becomes a paper "learning
# trade" — long OR short by the model's own view — that resolves on stop/target/time and feeds
# patterns / P(win) / source-weights. These NEVER touch real equity, the mastery ladder, or the money
# gate. This is the #1 lever to take the learner from ~1 sample/day to hundreds: in shadow information
# is free, so buy a lot of it. The mastery ladder still earns ONLY on conviction-grade trades.
exploration:
  enabled: true
  top_k: 20              # learning trades opened per cycle (the most-UNCERTAIN qualifying names first)
  notional_usd: 100      # paper size per learning trade — OFF the real $500 book (bookkeeping only)
  allow_short: true      # take the SHORT side when the model's view is bearish — learn the down-tape too
  short_pwin: 0.45       # P(win) below this (or analyst direction != up) -> short instead of long
  credit_rate: 0.10      # source-weight learning rate for a learning trade (> obs 0.05, < real trade 0.15)
  max_open: 300          # concurrent learning-position cap (uncapped vs the money book's 10)
  max_per_catalyst: 4    # WS2 diversity: cap learning trades per catalyst so the budget spreads across types

# Per-source trust (the learning loop tunes these within [0.1, 1.2])
source_weights:
  edgar_8k: 1.00
  edgar_form4: 0.95
  edgar_13d: 1.00
  newswire: 1.00
  fda: 0.90
  index_inclusion: 0.90
  gov_contract: 0.85
  alpaca_news: 0.80
  finnhub: 0.80
  finnhub_earnings: 0.85
  hackernews: 0.45
  google_news: 0.45
  apewisdom: 0.35
  stocktwits: 0.35
  reddit: 0.35
  x_relay: 0.30
  discord: 0.25
  telegram: 0.25
  polymarket: 0.55
  wiki_attention: 0.45
  nasdaq_halts: 0.60
  sec_fulltext: 0.85
  hiring: 0.50
  appstore: 0.55
  steam: 0.50
  github: 0.40
  pypi: 0.55
  npm: 0.50
  docker: 0.50
  appreviews: 0.50
  onchain: 0.60
  hiring_ats: 0.50
  web_traffic: 0.55
  jets: 0.35
  congress: 0.45

# Per-catalyst prior drift multiplier + default hold (learning tunes these too)
catalysts:
  earnings_beat:     {prior: 1.10, hold_days: 5,  stop_pct: 8, target_pct: 12}
  index_inclusion:   {prior: 1.20, hold_days: 7,  stop_pct: 6, target_pct: 10}
  fda_approval:      {prior: 1.05, hold_days: 3,  stop_pct: 10, target_pct: 20}
  mna_target:        {prior: 1.15, hold_days: 10, stop_pct: 6, target_pct: 15}
  gov_contract:      {prior: 1.05, hold_days: 5,  stop_pct: 8, target_pct: 12}
  activist_stake:    {prior: 1.10, hold_days: 10, stop_pct: 8, target_pct: 15}
  insider_cluster:   {prior: 1.00, hold_days: 10, stop_pct: 8, target_pct: 12}
  ai_quantum_breakout: {prior: 0.95, hold_days: 3, stop_pct: 8, target_pct: 12}

# ---- Hard risk law (enforced OUTSIDE the model — the bot cannot reason past these) ----
risk:
  max_open_positions: 10        # 4->10: more concurrent shadow positions -> more resolved outcomes/week -> mastery climbs faster
  daily_loss_pct: 0.10          # >>> lose 10% of capital in a day -> HARD STOP for the whole day + deep reflection
  caution_step: 5               # after a -10% day, the conviction bar rises this much per breach
  caution_max: 6                # max caution ratchet (so bar can climb to +30)
  daily_max_loss_usd: 100.0     # secondary absolute backstop
  repeated_exec_limit: 50       # auto-disarm after this many entries in a window (frequency allowed, abuse not)
  min_price: 2.0                # never buy sub-$2 (pump/penny filter)
  min_dollar_volume: 5000000    # liquidity floor so a small order doesn't eat slippage
  block_microcap_social_only: true  # a microcap moved only by social = blocked
  regime_filter: true           # skip longs when the broad tape (SPY) is in a downtrend

# ---- Market regime ----
regime:
  proxy: SPY
  downtrend_lookback_days: 20

# ---- Market clock (the bot must KNOW when the exchange is open — a closed market can't be traded) ----
market:
  require_open: true            # HARD LAW: never OPEN a position off-hours (weekend/holiday/after-hours)
  allow_extended_hours: false   # if true, also allow pre-market (04:00-09:30 ET) + after-hours (16:00-20:00 ET)

# ---- Price action: candlesticks + indicators decide WHEN to enter / exit (the catalyst decides WHAT) ----
technicals:
  enabled: true
  rsi_overbought: 70
  rsi_oversold: 30
  entry_veto_on_bearish_reversal: true   # block a BUY into a shooting-star / bearish-engulfing at the highs
  exit_on_bearish_reversal: true         # a bearish reversal candle (+overbought / trend-break) -> take the exit

# ---- Options & volatility intelligence (where informed money positions BEFORE the catalyst) ----
options:
  enabled: true
  confirm_bias: 0.25            # options tape this bullish -> counts as an ORTHOGONAL confirmation pillar
  contra_bias: 0.35            # heavy put positioning into a long -> shrink the score (caution)
  exit_bias: 0.50              # strongly bearish options flow on a held long -> take the exit

# ---- Fundamentals / float / short interest (how violently it can move + zombie filter) ----
fundamentals:
  enabled: true
  squeeze_boost: 0.2           # small-float + heavily-shorted -> a confirmed long can run further
  zombie_quality_floor: 0.3   # below this quality (cash-burning, shrinking) -> trust the catalyst less

# ---- Continuous self-review (diagnoses its own behaviour, auto-applies safe fixes, flags the rest) ----
selfreview:
  enabled: true
  every_cycles: 240            # ~hourly at a 15s tick; also runs on the first cycle and each new day
  min_samples: 5              # don't "recommend" anything until there's enough real data to back it

# ---- Tentacles (sources) to poll ----
sources:
  edgar: true
  apewisdom: true
  hackernews: true
  market_news: true             # OUR OWN newswire (free Alpaca/Benzinga replacement) — the 'news' family
  polymarket: true              # §18 crowd-forecast (often leads the news)
  usaspending: true             # §18 federal contract awards
  clinicaltrials: true          # §18 biotech trial status
  berkshire_13f: true           # §18 track Buffett's reported holdings (quarterly, low weight)
  openinsider: true             # SCRAPED whale signal — OpenInsider cluster buys (no API)
  nasdaq_halts: true            # NEW tentacle — Nasdaq trading halts/resumptions (volatility catalyst)
  sec_fulltext: true            # scrape pack — EDGAR full-text phrase search (merger/FDA/going-concern)
  hiring: true                  # scrape pack — Greenhouse hiring-velocity alt-data
  appstore: true                # DEMAND layer — App Store rank climbs (free primary, vs Sensor Tower)
  steam: true                   # DEMAND layer — Steam live concurrent-player surges (game publishers)
  github: true                  # DEMAND layer — dev-tool adoption via repo star velocity
  pypi: true                    # DEMAND layer — PyPI download velocity (dev-tool revenue proxy)
  npm: true                     # DEMAND layer — npm download velocity
  docker: true                  # DEMAND layer — Docker Hub pull velocity
  appreviews: true              # DEMAND layer — App Store review count velocity + rating sentiment
  onchain: true                 # ONCHAIN layer — BTC/crypto read-through to COIN/MSTR/miners
  hiring_ats: true              # ALT layer — Lever/Ashby/SmartRecruiters hiring velocity
  web_traffic: true             # DEMAND layer — Cloudflare Radar domain traffic (needs CLOUDFLARE_API_TOKEN)
  jets: true                    # FLOW layer — ADS-B corporate-jet movement (needs verified JET_REGISTRY)
  congress: true                # FLOW layer — politician trades (needs FMP_API_KEY; weak/stale, confirm-only)
  megafleet: true               # tiered rotating tentacles
  fleet_universe: all           # 'all' = full US listings (~10k+ tentacles) | 'sp500' = focused ~1155
  fleet_fast_batch: 30          # liquid-core feeds polled per tick (stay fresh)
  fleet_wide_batch: 30          # long-tail feeds polled per tick (slow sweep; anti-ban)
  fleet_wide_cap: 40000         # every US-listed symbol x 3 news angles. ⚠️ count != edge: beyond ~10k real stocks the rest are warrants/units the liquidity gate blocks.
  fred_expand_cap: 3000         # auto-discover this many MORE FRED series (housing/health/farmland/...) via the key
  wiki_attention: true          # web-visitor proxy: Wikipedia pageview spikes per company (earnings predictor)
  rss_feeds:                    # generic RSS tentacle — drop RSSHub / Nitter / Telegram-RSS / Google-News URLs here
    # - https://www.globenewswire.com/RssFeed/orgclass/1/feedTitle/GlobeNewswire
    # - https://rsshub.app/twitter/user/DeItaone     # X-around via self-hosted RSSHub
    []
  poll_seconds: 10             # loop tick (sped up 15->10 for faster recursion; analyst.max_llm_per_cycle still caps Groq calls/min — raise back if Groq 429s)
  signal_window_sec: 1800      # rolling signal memory (30m) so async polls confirm each other

# ---- Exit engine (when to SELL) ----
exits:
  trail_pct: 5.0               # give back 5% from the peak after a gain -> lock it in
  trail_arm_pct: 4.0           # only start trailing once up +4%

# ---- Analyst brain: a COMBINATION of the free LLM + the rule heuristic (both vote, then fuse) ----
analyst:
  enabled: true
  provider: groq                # groq = FREE Groq LLM (needs GROQ_API_KEY) COMBINED with the heuristic.
                                #        anthropic = paid Claude (needs ANTHROPIC_API_KEY) — NOT free, off by default.
                                #        heuristic = rules only.
  model: claude-opus-4-8        # only used if provider == anthropic
  max_llm_per_cycle: 2          # cap LLM calls per cycle (top candidates only); also budget-gated in llm.py
  min_independent_pillars: 2    # need >=2 ORTHOGONAL evidence TYPES (filing+price+options...), not 2 echoes
  hot_timeout: 6.0              # WS5: per-call LLM timeout in the hot loop (a slow model can't stall the 10s tick)
  hot_budget_sec: 8.0           # WS5: total LLM seconds/cycle before the judge degrades to distilled+heuristic

# ---- 24/7 simulation engine: replay the cached decade as paper episodes, always learning ----
sim:
  enabled: true
  history_years: 10            # how much old data to load + study (S&P500 + watchlist, daily bars)
  history_slice: 40            # tickers topped-up per refresh (incremental, never blocks)
  history_refresh_seconds: 120 # how often to top up the decade cache (the full ~1,200 fills in ~1.5h)
  episodes_per_cycle: 150      # historical replays per loop tick (60->150: pure local compute, no API/ban cost -> learn the decade ~2.5x faster)
  event_move_pct: 3.0          # a 1-day move >= this counts as a catalyst-like event to study
  hold_days: 5
  stop_pct: 8.0
  target_pct: 12.0
  sim_risk_frac: 0.10          # notional risked per episode (drives the visible sim-equity curve)
  parallel_workers: 4          # concurrent bar-cache pre-warm per sim batch (faster replays; 1 = serial)
  # WS4: keep the sim curve HONEST — window it so it can't fantasy-compound to $1e60 (an unbounded
  # compounder is an overfit symptom, not progress), and throttle replays once the decade is saturated.
  equity_reset_episodes: 5000  # snapshot the window's growth + reset the sim curve to start every N episodes
  equity_cap_x: 1000.0         # hard backstop: cap the sim curve at start x this (also reset on hit)
  saturation_episodes: 200000  # beyond this, replaying the frozen decade adds ~no info -> throttle replays
  saturated_per_cycle: 10      # ...down to this trickle, freeing compute for WS1's FORWARD learning trades

# ---- Progressive learning: label every setup at MULTIPLE horizons so learning accrues in HOURS ----
learning:
  horizons_hours: [1, 24, 120]      # resolve each observation at 1h / 1d / 5d (short = fast, long = real)
  horizon_credit: [0.03, 0.05, 0.08]  # credit rate per horizon (short = noisier = lighter); < a real trade's 0.15

# ---- WS6 Learning velocity: make "is it actually learning?" the headline metric, measured honestly ----
velocity:
  improving_eps: 0.002        # a 7-day Brier drop >= this counts as genuine calibration improvement
  no_edge_min_samples: 1500   # only call "no edge" once this many P(win) samples have accrued
  no_edge_brier: 0.245        # ...AND Brier is still at/above the ~no-skill baseline (0.25) and not improving
  verdict_min_trades: 200     # "is it on the right path?" verdict needs this many practice trades...
  verdict_min_days: 7         # ...OR this many daily snapshots before it's TOO EARLY -> a real call

# ---- Walk-forward validation: the overfit killer (replaces a single train/test split) ----
validation:
  walk_forward_folds: 7        # bucket events into K time-ordered folds; a survivor must hold across them
  min_fold_winrate: 0.4        # must be positive-expectancy in a MAJORITY of folds, not one lucky stretch
  regime_stratify: true        # AND positive across uptrend + downtrend regimes (no bull-only edge)

# ---- Warm-start: a fresh boot/volume starts smart, not cold (mastery is NEVER warm-started) ----
warmstart:
  enabled: true
  skip_above_n: 150            # don't warm-start once the P(win) model already has this many real samples
  ledger_cap: 5000             # replay up to this many resolved observations (real feature vectors)
  sim_episodes: 300            # weak momentum/trend prior from historical episodes (low learning rate)

# ---- #1 Transfer-gap: train a decade-of-history P(win) prior in the LIVE feature space (alpha-labeled),
# blended into the live P(win) at a low weight so the whole decade informs live calls without owning them.
histtrain:
  enabled: true
  events_per_pass: 120         # historical catalyst-like events trained per loop tick
  event_move_pct: 3.0          # a 1-day up-move >= this counts as a catalyst-like event
  learn_rate: 0.02             # low -> a PRIOR; real live outcomes still dominate the blended P(win)

# ---- Night coach: self-improvement (PROPOSE-ONLY for code; auto-tunes weights/lessons live) ----
coach:
  enabled: true
  every_minutes: 30            # cadence (10->30: the LLM pass is budget-gated; this keeps daily Groq use sane)
  min_source_samples: 8        # don't retune a source's weight until it has this many resolved outcomes

# ---- The Hive: 24/7 recursive multi-model agent council (agents work tasks AND spin up more tasks) ----
# Models in roles (coordinator/coder/reviewer/judge/strategist) check each other's work; vetted code
# becomes a ✅/❌ Telegram card -> CI test-gate on approval. Queue persists on the volume (never lost).
hive:
  enabled: true
  every_minutes: 45            # bounded cadence (free-tier safe; "every second" would just rate-limit)
  max_tasks_per_tick: 1        # at most N queued tasks per tick (each = a few cross-model LLM calls)
  seed_when_below: 3           # COORDINATOR refills the queue when it drops below this (the recursion engine)
  max_seed: 5                  # how many new tasks the coordinator may enqueue at once
  max_queue: 40                # backlog cap (persisted in knowledge.json — survives restarts)
  code_impact: 62              # impact score for a cross-reviewed code card

# ---- The Forge: FREE deterministic recursive search engine (the keystone). Many experiments/tick on the
# REAL outcome ledger, NO LLM per step; the LLM is called only as a RARE oracle when the search plateaus ----
forge:
  enabled: true
  every_minutes: 20
  population: 300              # HUNDREDS of free experiments per generation (raise freely — still $0/CPU)
  generations_per_tick: 6     # each generation breeds the next => 300 x 6 = 1,800 free experiments/tick
  elite_frac: 0.2             # top 20% survive + breed the next hundreds
  explore_frac: 0.1           # 10% fresh random explorers each generation (escape local optima)
  plateau_ticks: 6            # ticks with no improvement before asking the LLM (rare oracle) for a direction
  min_alpha_gain: 0.2         # loosened (was 0.3): pursue more meaningful changes from the free search
  forward_frac: 0.2           # WS4: hold out the most-recent 20% of setups as a truly out-of-time FORWARD
                              #       test; the champion only earns LIVE influence if it beats it too

# ---- Semantic memory: recall outcomes of SIMILAR past setups (k-NN over bge-m3); bounded advisory nudge ----
memory:
  k: 25                # average over the k nearest past setups
  min_corpus: 60       # need this many labeled setups before it activates
  corpus_cap: 1200     # most-recent setups to index
  refresh_min: 60      # rebuild the index hourly (picks up new setups)

# ---- Off-volume daily backup of the learned brain to a PRIVATE GitHub repo (never lose context) ----
backup:
  enabled: true
  github_repo: Acuntel/tentacle-state   # uses GITHUB_DISPATCH_TOKEN (already set for the approval loop)

# ---- 24/7 self-code audit: read + critique its OWN source on loop, journal fixes (propose-only) ----
audit:
  enabled: true
  every_minutes: 20            # one module reviewed per pass (60->20: sweeps the codebase 3x faster)

# ---- Strategy tournament: N strategies compete on the decade; the champion's rules go LIVE ----
strategies:
  enabled: true
  count: 200                   # hundreds competing at once (5/10/100/1000 allowed — but count != edge)
  events_per_cycle: 500        # historical events each strategy trades per heartbeat (250->500: pure compute -> ~2x faster convergence)
  min_trades_to_rank: 40       # don't rank a strategy until it has this many trades
  # each heartbeat: all compete on the same events -> blend the top-5 into the live rule -> breed the
  # best / retire the worst so the population keeps drifting toward what beats the market.

# ---- On-demand enrichment (brain pulls more data on under-confirmed names) ----
enrichment:
  max_per_cycle: 2             # probe at most N under-confirmed tickers per tick
  cooldown_sec: 1800          # don't re-probe the same ticker within 30m (rate-limit safe)

# ---- Telegram: the bot texts Brady through the Nesso content-engine bot ("Nessobot") ----
# Needs Railway vars TELEGRAM_BOT_TOKEN (= Nessobot's token) + TELEGRAM_CHAT_ID (@userinfobot). Off until set.
telegram:
  enabled: true
  shared_bot: true             # TRUE = we share Nessobot's token: SEND only, NEVER poll (Nesso owns the
                               #        getUpdates loop; two pollers 409-conflict). Sets TELEGRAM_SHARED_BOT.
                               #        FALSE = Tentacle owns a dedicated bot and polls for ✅/❌ taps itself.
  daily_digest: true           # once/day summary of the AUTO-applied tuning (weights/lessons) — no approval
  max_proposals_per_day: 20    # AUTONOMOUS self-changes back ON 2026-06-30 (Brady: keep the strat, run the
                               #    whole machine hot — self-code + agents + Telegram updates flowing again).
  min_interval_min: 20         # less pacing friction so meaningful changes actually land
  min_impact: 40               # loosened quality bar (was 60) so it can make real changes, not just tiny ones
  pool_refill_below: 12        # keep CONSTANTLY thinking — maintain a deep backlog of scored candidates
  min_impact_floor: 25         # absolute floor — ideas below this are never sent (junk)
  always_send_best: true       # if nothing clears min_impact, still send the BEST idea flagged ⚠️ low-confidence
  max_tool_requests_per_day: 3 # cap on the Hive's "I'd like a new tool" Telegram asks

# ---- Approve/deny: an approved change is gate-tested + merged + redeployed by the apply-approved Action ----
# Needs Railway var GITHUB_DISPATCH_TOKEN (fine-grained PAT, contents+actions write) and repo secret
# RAILWAY_TOKEN (project token) for the auto-deploy. Without them, approvals are saved to a queue file.
approvals:
  enabled: true
  scope: notable               # code + new sources + config/strategy threshold shifts ("everything notable")
  auto_deploy: true            # approve -> commit to main + railway up (real-money gate stays locked regardless)
  autonomous: true             # FULL internal autonomy: apply self-changes + TEXT Brady (no ✅/❌ questions)
  knob_cooldown_min: 2880      # 6h -> 48h: don't re-tune the SAME knob for 2 days (kills the fast oscillation)
