[pytest]
# TENTACLE test suite. Fast, hermetic, no network, no real state, no money.
# Run: .venv/bin/python -m pytest      (CI runs exactly this, as the FIRST gate)
testpaths = tests
addopts = -q --strict-markers --tb=short
markers =
    invariant: pins a rule the autopsy proved was broken — a failure here is a REGRESSION, not a flake
    rail: pins a safety rail (risk law, money gate, locked files). Never delete or weaken one of these.
filterwarnings =
    ignore::DeprecationWarning
